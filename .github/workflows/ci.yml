name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Stop obsolete checks when another commit arrives on the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Check infrastructure formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Initialize providers without a remote backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate infrastructure
        run: terraform -chdir=infra/terraform validate
      - name: Test publishing permissions without AWS credentials
        run: terraform -chdir=infra/terraform test

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and exercise local containers without model or credentials
        run: bash scripts/check_containers.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check search, map, country pages, and refresh status in Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Stop disposable containers
        if: always()
        run: docker compose down --volumes

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Test migrations, development seeds, and database permissions
        run: bash scripts/check_database.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test website queries against PostgreSQL
        working-directory: frontend
        run: |
          npm ci
          npm run test:postgres
      - name: Stop disposable database
        if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Compilation only: CI must never require production credentials.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test database error handling
        run: npm run test:queries
      - name: Build website
        run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install our package, but no ML dependencies or model downloads.
      - name: Install runtime package without dependencies
        run: python -m pip install --no-deps .
      - name: Check command entry point
        run: safetrip --help
      - name: Test scoring
        run: python -m unittest discover -s tests -v
      - name: Test writer credential configuration
        run: python -m unittest discover -s db/tests -v
      - name: Reproduce captured scores
        run: python -m scripts.verify_baseline
